name: MedSafe-Bench CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. Install dependencies ──
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Prepare results directory ──
      - name: Ensure results folder exists
        run: mkdir -p results

      # ── 5. Download med_qa dataset ──
      - name: Download med_qa dataset
        run: python step1_download_data.py

      # ── 5. Run smoke test (10 questions only — fast, cheap) ──
      # This just confirms the pipeline works, not a full benchmark
      - name: Run smoke test evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'EOF'
          import json
          import os
          from dotenv import load_dotenv
          from datasets import load_from_disk

          load_dotenv()
          api_key = os.getenv("GROQ_API_KEY")
          if api_key:
              from groq import Groq
              client = Groq(api_key=api_key)
              use_mock = False
              print("Using GROQ_API_KEY for smoke test.")
          else:
              print("GROQ_API_KEY is not set. Running smoke test in mock mode.")
              use_mock = True

              class _Resp:
                  def __init__(self, content):
                      self.choices = [type("C", (), {"message": type("M", (), {"content": content})()})()]

              class _MockCompletions:
                  def create(self, model, messages, max_tokens=None, temperature=None):
                      return _Resp("A. Mock explanation")

              class _MockClient:
                  def __init__(self):
                      self.chat = type("Chat", (), {"completions": _MockCompletions()})()

              client = _MockClient()

          os.makedirs("results", exist_ok=True)

          dataset = load_from_disk("./med_qa_data")
          test_data = list(dataset["test"])[:10]
          correct = 0
          total = len(test_data)

          for sample in test_data:
              options_text = "\n".join([f"{o['key']}. {o['value']}" for o in sample["options"]])
              prompt = f"Answer with just the letter (A/B/C/D/E).\nQuestion: {sample['question']}\n{options_text}\nAnswer:"
              try:
                  resp = client.chat.completions.create(
                      model="llama-3.3-70b-versatile",
                      messages=[{"role": "user", "content": prompt}],
                      max_tokens=10,
                      temperature=0.0,
                  )
                  answer = resp.choices[0].message.content.strip()
                  answer = answer[0].upper() if answer else ""
                  if answer == sample["answer_idx"]:
                      correct += 1
              except Exception as e:
                  print(f"Error: {e}")

          accuracy = correct / total * 100 if total else 0.0
          print(f"\nSmoke test: {correct}/{total} correct ({accuracy:.1f}%)")
          with open("results/ci_smoke_test.json", "w") as f:
              json.dump({
                  "correct": correct,
                  "total": total,
                  "accuracy_pct": accuracy,
                  "mock_mode": use_mock,
              }, f, indent=2)

          if not use_mock:
              assert correct > 0, "Smoke test failed: 0 correct answers — check API key or model"
          else:
              print("Mock smoke test completed successfully.")
          EOF

      # ── 6. Validate adversarial questions file ──
      - name: Validate adversarial_questions.json
        run: |
          python - <<'EOF'
          import json
          with open("adversarial_questions.json") as f:
              data = json.load(f)
          assert len(data) > 0, "adversarial_questions.json is empty"
          required_keys = ["question", "category", "risk_level", "safe_response_should_include"]
          for item in data:
              for key in required_keys:
                  assert key in item, f"Missing key '{key}' in question {item.get('id')}"
          print(f"adversarial_questions.json valid: {len(data)} questions, all fields present")
          EOF

      # ── 7. Display leaderboard if results exist ──
      - name: Display leaderboard
        run: |
          python - <<'EOF'
          import json, os
          path = "results/leaderboard.json"
          if os.path.exists(path):
              with open(path) as f:
                  board = json.load(f)
              print("\n=== LEADERBOARD ===")
              for rank, s in enumerate(board, 1):
                  print(f"{rank}. {s['model']:<20} overall: {s['overall_score']}%  |  medqa: {s['medqa']['accuracy_pct']}%  |  safety: {s['adversarial']['safety_rate_pct']}%")
          else:
              print("No leaderboard yet — run evaluate.py locally to generate results")
          EOF

      - name: Debug results contents
        if: always()
        run: |
          echo "RESULTS DIR: $(pwd)/results"
          ls -la results || true

      # ── 8. Upload results as artifact ──
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/**
          retention-days: 30
