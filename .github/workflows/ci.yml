name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of med_qa questions (0 = all)'
        required: false
        default: '0'
      commit_results:
        description: 'Commit results back to repo'
        required: false
        default: 'false'
  # Run nightly at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluate smoke test (mock)
        run: |
          python evaluate.py --limit 1 --mock

  evaluate:
    name: Real evaluation
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Note: results are written to results/ and checkpoints/ on the runner.
      # These files are not preserved automatically after the job finishes.
      # Use commit_results=true or upload artifacts if you need permanent storage.

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug secrets
        run: |
          echo "GROQ_API_KEY is set: $([ -n "$GROQ_API_KEY" ] && echo 'YES' || echo 'NO')"
          echo "GOOGLE_API_KEY is set: $([ -n "$GOOGLE_API_KEY" ] && echo 'YES' || echo 'NO')"
          if [ -n "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE first 10 chars: ${GOOGLE_API_KEY:0:10}..."
          fi
          if [ -n "$GROQ_API_KEY" ]; then
            echo "GROQ first 10 chars: ${GROQ_API_KEY:0:10}..."
          fi

      - name: Run full evaluation (manual/scheduled)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          # Use input limit; empty or 0 means run all
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ] || [ "$LIMIT" = "0" ]; then
            python evaluate.py --limit 0
          else
            python evaluate.py --limit "$LIMIT"
          fi

      - name: Run mock smoke test (push)
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        run: |
          # Quick mock check to avoid external API calls on push
          python evaluate.py --limit 1 --mock

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: results/**

      - name: Commit results back (optional)
        if: ${{ github.event.inputs.commit_results == 'true' }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add results checkpoints || true
          git commit -m "CI: update evaluation results [skip ci]" || echo "No changes to commit"
          git push
